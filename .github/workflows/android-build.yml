name: Android APK Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Lint, test and build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM and Robolectric unit tests
        run: ./gradlew :core:model:test :core:engine:test :content:test :core:data:test :app:testDebugUnitTest --console=plain

      - name: Android lint
        run: ./gradlew :app:lintRelease --console=plain

      - name: Balance simulation (120 turns, seed 42)
        run: ./gradlew :tools:balance-sim:run --args="120 42" --console=plain

      - name: Bot playthrough (5 seeds x 120 turns x 3 behaviors)
        run: ./gradlew :tools:balance-sim:balanceBot --console=plain

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify minSdk/targetSdk and no INTERNET permission
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -1)
          echo "AAPT: $AAPT"
          "$AAPT" dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion|native-code" || true
          if ! "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'35'"; then
            echo "ERROR: minSdk is not 35" && exit 1
          fi
          if ! "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'35'"; then
            echo "ERROR: targetSdk is not 35" && exit 1
          fi
          echo "--- permissions ---"
          "$AAPT" dump permissions "$APK"
          if "$AAPT" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "ERROR: INTERNET permission present in release APK" && exit 1
          fi
          echo "OK: minSdk=35, no INTERNET permission"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Termgn-Android-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
