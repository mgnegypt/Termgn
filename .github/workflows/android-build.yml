name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Lint, test and build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Asset license gate
        run: python3 tools/check_assets.py

      - name: JVM and Robolectric unit tests
        run: ./gradlew :core:model:test :core:engine:test :content:test :core:data:test :core:audio:test :app:testDebugUnitTest --console=plain

      - name: Android lint
        run: ./gradlew :app:lintRelease --console=plain

      - name: Balance simulation (120 turns, seed 42)
        run: ./gradlew :tools:balance-sim:run --args="120 42" --console=plain

      - name: Bot playthrough (5 seeds x 120 turns x 3 behaviors)
        run: ./gradlew :tools:balance-sim:balanceBot --console=plain

      - name: Derive version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="0.0.0-dev"
          fi
          MAJOR=$(echo "$TAG" | cut -d. -f1 | tr -cd '0-9')
          MINOR=$(echo "$TAG" | cut -d. -f2 | tr -cd '0-9')
          PATCH=$(echo "$TAG" | cut -d. -f3 | tr -cd '0-9')
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          echo "versionName=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "versionCode=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -n "$MGN_KEYSTORE_B64" ]; then
            echo "$MGN_KEYSTORE_B64" | base64 -d > /tmp/mgn-release.jks
            echo "MGN_KEYSTORE_PATH=/tmp/mgn-release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret; release will use debug keys."
          fi
        env:
          MGN_KEYSTORE_B64: ${{ secrets.MGN_KEYSTORE_B64 }}

      - name: Assemble release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PversionCode=${{ steps.version.outputs.versionCode }} -PversionName=${{ steps.version.outputs.versionName }} --console=plain
        env:
          MGN_STORE_PASSWORD: ${{ secrets.MGN_STORE_PASSWORD }}
          MGN_KEY_ALIAS: ${{ secrets.MGN_KEY_ALIAS }}
          MGN_KEY_PASSWORD: ${{ secrets.MGN_KEY_PASSWORD }}

      - name: Verify minSdk/targetSdk and no INTERNET permission
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -1)
          echo "AAPT: $AAPT"
          "$AAPT" dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion|native-code" || true
          if ! "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'35'"; then
            echo "ERROR: minSdk is not 35" && exit 1
          fi
          if ! "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'35'"; then
            echo "ERROR: targetSdk is not 35" && exit 1
          fi
          echo "--- permissions ---"
          "$AAPT" dump permissions "$APK"
          if "$AAPT" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "ERROR: INTERNET permission present in release APK" && exit 1
          fi
          echo "OK: minSdk=35, no INTERNET permission"

      - name: APK size and asset gate
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          python3 tools/check_assets.py --apk "$APK" --max-mb 150

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Termgn-Android-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Termgn-Android-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Create GitHub Release with APK and AAB
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
